<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guy Battle — Physics Arena</title><style>*{box-sizing:border-box}body{margin:0;background:#10131a;color:#fff;font-family:system-ui,sans-serif}header{text-align:center;padding:14px;background:#171c27;border-bottom:1px solid #303849}h1{margin:0;font-size:26px}main{max-width:760px;margin:auto;padding:14px}.card{background:#191f2b;border:1px solid #303849;border-radius:16px;padding:14px;margin-bottom:14px}.fighters{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.fighter{padding:10px;border-radius:12px;border:2px solid transparent;background:#242b39;text-align:center;cursor:pointer}.fighter.selected{border-color:#57e389}.avatar{font-size:34px}.fighter small{display:block;color:#b9c1cf;margin-top:4px}button{border:0;border-radius:12px;padding:11px 17px;background:#57e389;color:#08110b;font-weight:800;font-size:16px}button:disabled{opacity:.45}#arenaWrap{position:relative;width:min(78vw,460px);margin:auto;aspect-ratio:1/1}canvas{width:100%;height:100%;display:block;background:#151a23;border:4px solid #566074;border-radius:12px}.controls{display:flex;justify-content:center;gap:10px;margin-top:10px;flex-wrap:wrap}.hint{text-align:center;color:#aeb6c5;font-size:13px;margin:8px 0}.hp{height:12px;background:#303746;border-radius:20px;overflow:hidden}.bar{height:100%;background:#57e389;width:100%;transition:.1s}@media(max-width:600px){.fighters{grid-template-columns:repeat(2,1fr)}}</style></head><body><header><h1>⚔️ GUY BATTLE</h1><small>Physics Arena v0.3</small></header><main><section id="select" class="card"><h2>اختر شخصيتين</h2><p class="hint">اضغط على شخصيتين مختلفتين. ستتحركان تلقائيًا، ترتدان عن الجدران، وتصطدمان وترتدان عن بعضهما.</p><div id="fighters" class="fighters"></div><div class="controls"><button id="start" disabled>ابدأ المعركة (0/2)</button></div></section><section id="game" class="card" style="display:none"><div id="arenaWrap"><canvas id="arena" width="600" height="600" aria-label="ساحة قتال مربعة"></canvas></div><p class="hint">حركة تلقائية • ارتداد من الجدران • ارتداد بين الشخصيتين • ضرر عند التصادم</p><div><b id="pLabel"></b><div class="hp"><div id="pBar" class="bar"></div></div></div><div style="margin-top:7px"><b id="eLabel"></b><div class="hp"><div id="eBar" class="bar"></div></div></div><p id="status" class="hint">الشخصيتان تتجهان داخل الحلبة وتعودان لبعضهما بعد الارتداد.</p><div class="controls"><button id="restart">إعادة المعركة</button><button id="choose">اختيار شخصيات أخرى</button></div></section></main><script>
const fighters=[{name:"Boxer",emoji:"🥊",hp:120,dmg:18,speed:3.5},{name:"Wizard",emoji:"🧙",hp:90,dmg:27,speed:2.9},{name:"Knight",emoji:"🛡️",hp:160,dmg:15,speed:2.6},{name:"Ninja",emoji:"🥷",hp:100,dmg:21,speed:4.1},{name:"Robot",emoji:"🤖",hp:140,dmg:20,speed:3.1},{name:"Chef",emoji:"👨‍🍳",hp:110,dmg:24,speed:3.4}];
const c=document.getElementById("arena"),ctx=c.getContext("2d"),$=id=>document.getElementById(id);let selected=[],raf=0,last=0;
const A={x:150,y:300,vx:3,vy:1.8,hp:100,max:100,r:27,cool:0},B={x:450,y:300,vx:-3,vy:-1.8,hp:100,max:100,r:27,cool:0};
fighters.forEach((f,i)=>{const d=document.createElement("div");d.className="fighter";d.innerHTML='<div class="avatar">'+f.emoji+'</div><b>'+f.name+'</b><small>❤️ '+f.hp+' • ⚔️ '+f.dmg+' • ⚡ '+f.speed+'</small>';d.onclick=()=>toggle(i);$("fighters").appendChild(d)});
function toggle(i){if(selected.includes(i))selected=selected.filter(x=>x!==i);else if(selected.length<2)selected.push(i);document.querySelectorAll(".fighter").forEach((x,j)=>x.classList.toggle("selected",selected.includes(j)));$("start").disabled=selected.length!==2;$("start").textContent="ابدأ المعركة ("+selected.length+"/2)"}
$("start").onclick=start;$("restart").onclick=start;$("choose").onclick=()=>{cancelAnimationFrame(raf);$("game").style.display="none";$("select").style.display="block"};
function start(){const f=fighters[selected[0]],e=fighters[selected[1]];A.x=150;A.y=300;A.vx=f.speed*(Math.random()<.5?1:-1);A.vy=f.speed*(Math.random()<.5?1:-1)*.72;A.max=A.hp=f.hp;A.cool=0;B.x=450;B.y=300;B.vx=e.speed*(Math.random()<.5?1:-1);B.vy=e.speed*(Math.random()<.5?1:-1)*.72;B.max=B.hp=e.hp;B.cool=0;$("pLabel").textContent=f.name+" "+f.emoji;$("eLabel").textContent=e.name+" "+e.emoji;$("select").style.display="none";$("game").style.display="block";$("status").textContent="راقب التصادم: عند الاصطدام يرتدان عن بعضهما، والجدران تعيد توجيههما إلى داخل الحلبة.";last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function loop(t){const dt=Math.min(32,t-last)/16.67;last=t;move(A,dt);move(B,dt);collide();draw();if(A.hp>0&&B.hp>0)raf=requestAnimationFrame(loop);else $("status").textContent=A.hp>0?"🏆 "+fighters[selected[0]].name+" فاز!":"🏆 "+fighters[selected[1]].name+" فاز!"}
function move(u,dt){u.x+=u.vx*dt;u.y+=u.vy*dt;if(u.x-u.r<8){u.x=8+u.r;u.vx=Math.abs(u.vx)}if(u.x+u.r>592){u.x=592-u.r;u.vx=-Math.abs(u.vx)}if(u.y-u.r<8){u.y=8+u.r;u.vy=Math.abs(u.vy)}if(u.y+u.r>592){u.y=592-u.r;u.vy=-Math.abs(u.vy)}u.cool-=dt}
function collide(){let dx=B.x-A.x,dy=B.y-A.y,dist=Math.hypot(dx,dy)||.001,min=A.r+B.r;if(dist<min){const nx=dx/dist,ny=dy/dist,overlap=min-dist;A.x-=nx*overlap/2;A.y-=ny*overlap/2;B.x+=nx*overlap/2;B.y+=ny*overlap/2;const rel=(B.vx-A.vx)*nx+(B.vy-A.vy)*ny;if(rel<0){const impulse=-rel*1.05;A.vx-=impulse*nx;A.vy-=impulse*ny;B.vx+=impulse*nx;B.vy+=impulse*ny}const f=fighters[selected[0]],e=fighters[selected[1]];if(A.cool<=0&&B.cool<=0){A.hp=Math.max(0,A.hp-(e.dmg+Math.random()*6));B.hp=Math.max(0,B.hp-(f.dmg+Math.random()*6));A.cool=18;B.cool=18}}}
function draw(){ctx.clearRect(0,0,600,600);ctx.fillStyle="#202838";ctx.fillRect(0,0,600,600);ctx.strokeStyle="#687287";ctx.lineWidth=6;ctx.strokeRect(5,5,590,590);ctx.strokeStyle="#ffffff0d";ctx.lineWidth=1;for(let i=60;i<600;i+=60){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,600);ctx.moveTo(0,i);ctx.lineTo(600,i);ctx.stroke()}unit(A,fighters[selected[0]]);unit(B,fighters[selected[1]]);$("pBar").style.width=Math.max(0,A.hp/A.max*100)+"%";$("eBar").style.width=Math.max(0,B.hp/B.max*100)+"%"}
function unit(u,f){ctx.beginPath();ctx.fillStyle="#2b3445";ctx.arc(u.x,u.y,u.r,0,Math.PI*2);ctx.fill();ctx.font="32px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(f.emoji,u.x,u.y);ctx.fillStyle="#fff";ctx.font="12px system-ui";ctx.fillText(Math.ceil(Math.max(0,u.hp)),u.x,u.y-40)}
</script></body></html>
