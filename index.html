<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d1118">
<title>GUY BATTLE • Clean Build</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1118;color:#fff;font-family:system-ui,-apple-system,sans-serif}
header{text-align:center;padding:18px 12px;background:#151b25;border-bottom:1px solid #2b3444}
h1{margin:0;font-size:28px}
header small{color:#aeb7c6}
main{max-width:760px;margin:auto;padding:14px}
.card{background:#171e29;border:1px solid #303a4b;border-radius:18px;padding:14px}
#wrap{width:min(94vw,620px);margin:auto}
canvas{width:100%;height:auto;display:block;background:#202938;border:5px solid #5d687d;border-radius:14px}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}
button{border:0;border-radius:13px;padding:12px 20px;background:#57e389;color:#07110a;font-weight:900;font-size:17px}
button:active{transform:scale(.98)}
.hint{text-align:center;color:#aeb7c6;margin:10px 0;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.panel{background:#222b39;border-radius:12px;padding:10px}
.panel b{display:block;margin-bottom:6px}
.hp{height:10px;background:#343e4e;border-radius:20px;overflow:hidden}
.bar{height:100%;background:#57e389;width:100%}
@media(max-width:520px){h1{font-size:24px}.card{padding:9px}}
</style>
</head>
<body>
<header><h1>⚔️ GUY BATTLE</h1><small>Clean Build • v1.0</small></header>
<main><section class="card">
<div id="wrap"><canvas id="arena" width="600" height="600"></canvas></div>
<p id="status" class="hint">السياف والمسدد يتحركان تلقائياً داخل الحلبة.</p>
<div class="grid">
<div class="panel"><b>⚔️ السياف — <span id="hpA">140</span></b><div class="hp"><div id="barA" class="bar"></div></div></div>
<div class="panel"><b>🔫 المسدس — <span id="hpB">120</span></b><div class="hp"><div id="barB" class="bar"></div></div></div>
</div>
<div class="controls"><button id="start">ابدأ المعركة</button><button id="reset">إعادة</button></div>
<p class="hint">السياف: ضربة سيف. المسدس: 4 طلقات، كل طلقة بعد 3.6 ثوانٍ، ثم إعادة تعبئة 7 ثوانٍ.</p>
</section></main>
<script>
"use strict";
const canvas=document.getElementById("arena"),ctx=canvas.getContext("2d");
const hpA=document.getElementById("hpA"),hpB=document.getElementById("hpB");
const barA=document.getElementById("barA"),barB=document.getElementById("barB");
const statusEl=document.getElementById("status");
const startBtn=document.getElementById("start"),resetBtn=document.getElementById("reset");

const sword={x:145,y:300,vx:170,vy:105,size:58,hp:140,maxHp:140,attackCd:0,swing:0,hitDone:false,angle:0};
const gun={x:455,y:300,vx:-175,vy:-100,size:58,hp:120,maxHp:120,ammo:4,shotTimer:3.6,reload:0};
let bullets=[],running=false,last=0,raf=0;

function reset(){
 running=false;cancelAnimationFrame(raf);bullets=[];
 Object.assign(sword,{x:145,y:300,vx:170,vy:105,hp:140,attackCd:0,swing:0,hitDone:false,angle:0});
 Object.assign(gun,{x:455,y:300,vx:-175,vy:-100,hp:120,ammo:4,shotTimer:3.6,reload:0});
 updateUI();draw();statusEl.textContent="السياف والمسدد يتحركان تلقائياً داخل الحلبة.";
}
function start(){
 reset();running=true;last=performance.now();statusEl.textContent="⚔️ المعركة بدأت!";raf=requestAnimationFrame(loop);
}
startBtn.onclick=start;resetBtn.onclick=reset;

function loop(now){
 if(!running)return;
 const dt=Math.min(0.035,(now-last)/1000);last=now;
 update(sword,dt);update(gun,dt);swordAttack(dt);gunAttack(dt);bulletUpdate(dt);bodyCollision();draw();updateUI();
 if(sword.hp<=0||gun.hp<=0){running=false;statusEl.textContent=sword.hp>0?"🏆 السياف فاز!":"🏆 شخصية المسدس فازت!";return}
 raf=requestAnimationFrame(loop);
}
function update(u,dt){
 u.x+=u.vx*dt;u.y+=u.vy*dt;
 const r=u.size/2;
 if(u.x-r<8){u.x=8+r;u.vx=Math.abs(u.vx)}
 if(u.x+r>592){u.x=592-r;u.vx=-Math.abs(u.vx)}
 if(u.y-r<8){u.y=8+r;u.vy=Math.abs(u.vy)}
 if(u.y+r>592){u.y=592-r;u.vy=-Math.abs(u.vy)}
}
function swordAttack(dt){
 sword.attackCd-=dt;sword.swing=Math.max(0,sword.swing-dt);
 if(sword.swing<=0&&sword.attackCd<=0){
  const d=Math.hypot(gun.x-sword.x,gun.y-sword.y);
  if(d<185){sword.swing=.32;sword.attackCd=1.15;sword.hitDone=false;sword.angle=Math.atan2(gun.y-sword.y,gun.x-sword.x)}
 }
 if(sword.swing>0&&!sword.hitDone&&sword.swing<.16){
  if(Math.hypot(gun.x-sword.x,gun.y-sword.y)<185)gun.hp=Math.max(0,gun.hp-25);
  sword.hitDone=true;
 }
}
function gunAttack(dt){
 if(gun.reload>0){gun.reload-=dt;if(gun.reload<=0){gun.reload=0;gun.ammo=4;gun.shotTimer=3.6}return}
 gun.shotTimer-=dt;
 if(gun.ammo>0&&gun.shotTimer<=0){
  const a=Math.atan2(sword.y-gun.y,sword.x-gun.x);
  bullets.push({x:gun.x+Math.cos(a)*38,y:gun.y+Math.sin(a)*38,vx:Math.cos(a)*520,vy:Math.sin(a)*520,life:1.4});
  gun.ammo--;gun.shotTimer=gun.ammo>0?3.6:0;
  if(gun.ammo===0)gun.reload=7;
 }
}
function bulletUpdate(dt){
 for(const b of bullets){
  b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
  if(b.life>0&&Math.hypot(b.x-sword.x,b.y-sword.y)<sword.size/2+7){sword.hp=Math.max(0,sword.hp-22);b.life=0}
 }
 bullets=bullets.filter(b=>b.life>0&&b.x>-20&&b.x<620&&b.y>-20&&b.y<620);
}
function bodyCollision(){
 const dx=gun.x-sword.x,dy=gun.y-sword.y,d=Math.hypot(dx,dy)||1,min=60;
 if(d<min){
  const nx=dx/d,ny=dy/d,push=(min-d)/2;
  sword.x-=nx*push;sword.y-=ny*push;gun.x+=nx*push;gun.y+=ny*push;
  const rv=(gun.vx-sword.vx)*nx+(gun.vy-sword.vy)*ny;
  if(rv<0){sword.vx+=rv*nx;sword.vy+=rv*ny;gun.vx-=rv*nx;gun.vy-=rv*ny}
 }
}
function updateUI(){
 hpA.textContent=Math.ceil(sword.hp);hpB.textContent=Math.ceil(gun.hp);
 barA.style.width=Math.max(0,sword.hp/sword.maxHp*100)+"%";barB.style.width=Math.max(0,gun.hp/gun.maxHp*100)+"%";
}
function draw(){
 ctx.clearRect(0,0,600,600);
 ctx.fillStyle="#202938";ctx.fillRect(0,0,600,600);
 ctx.strokeStyle="#657187";ctx.lineWidth=6;ctx.strokeRect(5,5,590,590);
 ctx.strokeStyle="rgba(255,255,255,.08)";ctx.lineWidth=2;
 for(let i=150;i<600;i+=150){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,600);ctx.moveTo(0,i);ctx.lineTo(600,i);ctx.stroke()}
 for(const b of bullets){ctx.fillStyle="#ffd34d";ctx.beginPath();ctx.arc(b.x,b.y,5,0,Math.PI*2);ctx.fill()}
 drawSword();drawGun();
}
function square(x,y,size,fill){ctx.fillStyle=fill;ctx.fillRect(x-size/2,y-size/2,size,size)}
function drawSword(){
 square(sword.x,sword.y,sword.size,"#dfe4eb");
 ctx.fillStyle="#273140";ctx.fillRect(sword.x-18,sword.y-20,36,42);
 ctx.fillStyle="#f4c36a";ctx.fillRect(sword.x-10,sword.y-28,20,10);
 ctx.fillStyle="#fff";ctx.font="bold 12px system-ui";ctx.textAlign="center";ctx.fillText(Math.ceil(sword.hp),sword.x,sword.y-38);
 if(sword.swing>0){
  const p=1-sword.swing/.32,a=sword.angle-1.0+p*2.0;
  ctx.save();ctx.translate(sword.x,sword.y);ctx.rotate(a);ctx.globalAlpha=.95;
  ctx.fillStyle="#d9dde3";ctx.fillRect(18,-4,125,8);
  ctx.fillStyle="#8b6a3e";ctx.fillRect(2,-6,24,12);ctx.restore();
 }
}
function drawGun(){
 square(gun.x,gun.y,gun.size,"#2a3445");
 ctx.save();ctx.translate(gun.x,gun.y);
 const a=Math.atan2(sword.y-gun.y,sword.x-gun.x);ctx.rotate(a);
 ctx.fillStyle="#67e34f";ctx.fillRect(-12,-16,46,25);ctx.fillStyle="#55b83d";ctx.fillRect(18,-10,28,12);ctx.fillStyle="#f0a928";ctx.fillRect(-3,8,15,25);ctx.restore();
 ctx.fillStyle="#fff";ctx.font="bold 12px system-ui";ctx.textAlign="center";ctx.fillText(Math.ceil(gun.hp),gun.x,gun.y-38);
 ctx.font="bold 11px system-ui";ctx.fillText(gun.reload>0?"🔄 "+gun.reload.toFixed(1)+"s":"🔫 "+gun.ammo+"/4",gun.x,gun.y+43);
}
reset();
</script>
</body>
</html>
